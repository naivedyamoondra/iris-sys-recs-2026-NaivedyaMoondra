version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: iris-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: iris_db
      MYSQL_USER: iris_user
      MYSQL_PASSWORD: iris_pass
    volumes:
      - iris-mysql-data:/var/lib/mysql
    networks:
      - iris-net

  rails-1:
    build: .
    container_name: iris-rails-1
    depends_on:
      - mysql
    networks:
      - iris-net

  rails-2:
    build: .
    container_name: iris-rails-2
    depends_on:
      - mysql
    networks:
      - iris-net

  rails-3:
    build: .
    container_name: iris-rails-3
    depends_on:
      - mysql
    networks:
      - iris-net

  nginx:
    image: nginx:latest
    container_name: iris-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - rails-1
      - rails-2
      - rails-3
    networks:
      - iris-net

volumes:
  iris-mysql-data:

networks:
  iris-net:


